name: Publish PYTHEN to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify tag, version and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) echo "Release tag must begin with v" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release commit is not in main" >&2
            exit 1
          }
          package_version="$(python setup.py --version)"
          if test "${GITHUB_REF_NAME#v}" != "$package_version"; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke test installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c 'import pythen; from pythen import RuleTreeEvaluator, Reasoner, LeapAnalyzer, Z3ChallengeAnalyzer; print(pythen.__version__)'
      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: pythen-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish verified distributions
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pythen/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: pythen-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
